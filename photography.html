<style>
:root{
  --paper:#FFFFFF;
  --ink:#111111;
  --mute:#8A8A85;
  --signal:#ff3b1f;
  --sans:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --hit:42px;
}
*{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--signal);color:#fff}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--signal);outline-offset:3px}

#topbar{
  position:fixed;top:0;left:0;right:0;z-index:80;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 24px;
  background:var(--paper);
  pointer-events:none;
}
#topbar a, #topbar button{pointer-events:auto}
#brand{
  font-size:15px;font-weight:600;letter-spacing:-.02em;
  min-height:var(--hit);display:flex;align-items:center;gap:10px;
}
#brand svg{width:20px;height:20px;display:block}
#toplinks{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:500}
#toplinks a, #toplinks button{
  color:var(--mute);min-height:var(--hit);padding:8px 10px;
  display:inline-flex;align-items:center;
}
#toplinks a:hover, #toplinks button:hover, #toplinks a.on, #toplinks button.on{color:var(--ink)}

#bgword{
  position:fixed;left:0;right:0;top:22vh;z-index:0;
  font-family:var(--serif);
  font-weight:500;font-style:italic;
  font-size:clamp(48px, 12vw, 168px);
  line-height:.9;letter-spacing:-.03em;
  text-align:center;
  color:#111;
  opacity:.11;
  pointer-events:none;
  user-select:none;
}

main#wall{position:relative;z-index:1;padding:72px 0 16vh}

.band{
  display:grid;
  grid-template-columns:repeat(12, minmax(0, 1fr));
  column-gap:clamp(12px, 1.5vw, 28px);
  width:min(1760px, 94vw);
  margin:0 auto;
  position:relative;
  padding-bottom:clamp(20px, 4.5vh, 56px);
}
.shot{
  grid-column:var(--col) / span var(--span);
  margin-top:calc(var(--mt) * 1vh);
  margin-bottom:calc(var(--mb) * 1vh);
  padding:0;
  text-align:left;
  cursor:pointer;
  display:block;
  width:100%;
  line-height:0;
  z-index:1;
}
.shot img{
  width:100%;height:auto;display:block;
  border-radius:0;
  transform:translate3d(0, var(--py, 0px), 0);
  will-change:transform;
}
.shot:hover img, .shot:focus-visible img{transform:translate3d(0, var(--py, 0px), 0) scale(1.012)}
.shot .cap{
  display:none;
  margin-top:8px;
  font-size:11px;font-weight:500;color:var(--mute);
  letter-spacing:.02em;line-height:1.3;
}
.shot[data-title]:hover .cap, .shot[data-title]:focus-visible .cap{display:block}

#lb{
  position:fixed;inset:0;z-index:200;background:rgba(255,255,255,.97);
  display:none;align-items:center;justify-content:center;
  padding:56px 48px 64px;
}
#lb.on{display:flex}
#lb img{width:auto;height:auto;max-width:92vw;max-height:86vh;object-fit:contain}
#lb .x, #lb .nav{
  position:absolute;color:var(--ink);min-width:var(--hit);min-height:var(--hit);
}
#lb .x{top:12px;right:16px;font-size:13px;font-weight:500}
#lb .nav.prev{left:8px;top:50%;transform:translateY(-50%);font-size:28px}
#lb .nav.next{right:8px;top:50%;transform:translateY(-50%);font-size:28px}
#lb .x:hover, #lb .nav:hover{color:var(--signal)}
#lb .meta{
  position:absolute;bottom:16px;left:24px;right:24px;
  display:flex;justify-content:space-between;
  font-size:12px;font-weight:500;color:var(--mute);
}

@media(max-width:1024px){
  .band{width:94vw}
}

@media(max-width:768px){
  #topbar{padding:10px 12px}
  #bgword{font-size:clamp(36px, 14vw, 64px); top:18vh; opacity:.08}
  .band{
    grid-template-columns:repeat(6, minmax(0, 1fr));
    padding-bottom:4vh;
  }
  .shot{
    grid-column:1 / -1 !important;
    max-width:88%;
    margin-top:5vh !important;
    margin-bottom:0 !important;
  }
  .shot.size-sm{max-width:62%; margin-left:16%}
  .shot.size-md{max-width:78%}
  .shot.size-lg, .shot.size-xl{max-width:92%}
  .shot.offset{margin-left:auto; margin-right:0}
  .shot.size-sm.offset{margin-right:8%}
  #lb{padding:48px 10px 56px}
  #lb .nav.prev{left:0} #lb .nav.next{right:0}
}

@media(prefers-reduced-motion:reduce){
  .shot img, #bgword{transition:none!important; transform:none!important; filter:none!important}
}

});

if(!reduceMotion && 'IntersectionObserver' in window){
  shots.forEach(function(btn){
    var img = btn.querySelector('img');
    img.style.opacity = '0';
    img.style.transition = 'opacity .7s ease';
  });
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      var img = en.target.querySelector('img');
      if(img) img.style.opacity = '1';
      io.unobserve(en.target);
    });
  }, { rootMargin: '80px 0px', threshold: 0.05 });
  shots.forEach(function(btn){
    var img = btn.querySelector('img');
    if(img.complete && img.naturalWidth) img.style.opacity = '1';
    else io.observe(btn);
  });
}

var bgword = document.getElementById('bgword');
function onScroll(){
  var y = window.scrollY || 0;
  if(bgword){
    bgword.style.opacity = String(Math.max(0.035, 0.12 - y / 2200));
    if(!reduceMotion) bgword.style.transform = 'translate3d(0,' + (y * 0.12) + 'px,0)';
  }
  if(reduceMotion) return;
  var vh = window.innerHeight || 1;
  shots.forEach(function(btn){
    var img = btn.querySelector('img');
    if(!img) return;
    var r = btn.getBoundingClientRect();
    if(r.bottom < -80 || r.top > vh + 80) return;
    var depth = parseFloat(btn.getAttribute('data-depth') || '0.4');
    var mid = r.top + r.height / 2 - vh / 2;
    var shift = -mid * depth * 0.06;
    if(shift > 28) shift = 28;
    if(shift < -28) shift = -28;
    btn.style.setProperty('--py', shift.toFixed(1) + 'px');
  });
}
window.addEventListener('scroll', onScroll, {passive:true});
onScroll();

var lb = document.getElementById('lb');
var lbImg = document.getElementById('lbImg');
var lbIdx = document.getElementById('lbIdx');
var curI = 0, sx = 0, sy = 0, savedY = 0, opener = null;
var lbFocus = [document.getElementById('lbX'), document.getElementById('lbPrev'), document.getElementById('lbNext')];

function showLb(){
  curI = (curI + PHOTOS.length) % PHOTOS.length;
  var it = PHOTOS[curI];
  lbImg.style.maxWidth = Math.min(it.w, Math.floor(window.innerWidth * 0.92), 1400) + 'px';
  lbImg.style.maxHeight = Math.min(it.h, Math.floor(window.innerHeight * 0.86)) + 'px';
  lbImg.src = it.src;
  lbImg.alt = t('alt');
  lbIdx.textContent = (curI + 1) + ' of ' + PHOTOS.length;
}
function openLb(i, fromEl){
  curI = i;
  savedY = window.scrollY || 0;
  opener = fromEl || document.activeElement;
  showLb();
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
  document.getElementById('lbX').focus();
}
function closeLb(){
  lb.classList.remove('on');
  document.body.style.overflow = '';
  window.scrollTo(0, savedY);
  if(opener && opener.focus) opener.focus();
}
wall.addEventListener('click', function(e){
  var btn = e.target.closest ? e.target.closest('.shot') : null;
  if(!btn) return;
  openLb(parseInt(btn.getAttribute('data-i'), 10), btn);
});
document.getElementById('lbX').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', function(e){ e.stopPropagation(); curI--; showLb(); });
document.getElementById('lbNext').addEventListener('click', function(e){ e.stopPropagation(); curI++; showLb(); });
lb.addEventListener('click', function(e){ if(e.target === lb) closeLb(); });
lb.addEventListener('touchstart', function(e){
  if(!e.touches || !e.touches[0]) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
lb.addEventListener('touchend', function(e){
  if(!e.changedTouches || !e.changedTouches[0]) return;
  var dx = e.changedTouches[0].clientX - sx;
  var dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy)) return;
  if(dx < 0) curI++; else curI--;
  showLb();
}, {passive:true});
document.addEventListener('keydown', function(e){
  if(!lb.classList.contains('on')) return;
  if(e.key === 'Escape'){ e.preventDefault(); closeLb(); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); curI++; showLb(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); curI--; showLb(); }
  else if(e.key === 'Tab'){
    var list = lbFocus.filter(function(n){ return n; });
    if(!list.length) return;
    var i = list.indexOf(document.activeElement);
    if(e.shiftKey){
      if(i <= 0){ e.preventDefault(); list[list.length-1].focus(); }
    } else {
      if(i === -1 || i === list.length-1){ e.preventDefault(); list[0].focus(); }
    }
  }
});

applyI18n();
})();
</script>
