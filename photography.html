<style>
:root{
  --paper:#FFFFFF;
  --ink:#111111;
  --mute:#8A8A85;
  --line:#E8E8E4;
  --signal:#ff3b1f;
  --sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gap:8px;
  --hang:48px;
  --pad:40px;
  --hit:42px;
}
*{box-sizing:border-box}
figure{margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.45;
}
::selection{background:var(--signal);color:#fff}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--signal);outline-offset:3px}

#topbar{
  position:sticky;top:0;z-index:80;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px var(--pad);
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
}
#brand{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;min-height:var(--hit);
}
#brand svg{width:22px;height:22px;display:block}
#brand em{font-style:normal;color:var(--signal)}
#brand b{font-weight:500}
#toplinks{
  display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:2px;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
}
#toplinks a, #toplinks button{
  background:none;border:0;cursor:pointer;text-decoration:none;color:var(--mute);
  min-height:var(--hit);padding:10px 11px;display:inline-flex;align-items:center;
}
#toplinks a:hover, #toplinks button:hover, #toplinks a.on, #toplinks button.on{color:var(--ink)}
#toplinks .langpair{display:flex;gap:0;margin-left:6px;border-left:1px solid var(--line);padding-left:6px}

.intro{padding:48px var(--pad) 12px;max-width:720px}
.intro h1{
  font-weight:700;letter-spacing:-.035em;line-height:.92;
  font-size:clamp(36px, 5.4vw, 56px);margin:0 0 10px;
}
.intro p{margin:0;color:var(--mute);max-width:46ch}

.projects{
  display:grid;grid-template-columns:repeat(4,1fr);gap:28px 32px;
  padding:40px var(--pad) 16px;
}
.project{
  display:block;text-decoration:none;color:inherit;cursor:pointer;
}
.project .ph{background:#f3f3f0;overflow:hidden;line-height:0}
.project img{width:100%;height:220px;object-fit:cover;display:block}
.project h2{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;font-weight:500;
  margin:10px 0 0;
}
.project:hover h2{color:var(--signal)}

.series-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:48px var(--pad) 8px;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  scroll-margin-top:64px;
}
.series-head h2{font-family:var(--sans);font-size:clamp(22px, 3vw, 32px);letter-spacing:-.03em;margin:0;font-weight:700}
.series-head .ct{color:var(--mute)}

#wall{
  display:block;
  padding:48px 8vw 96px;
  width:100%;
  overflow:visible;
}
.row{
  display:flex;flex-wrap:nowrap;align-items:flex-end;
  justify-content:flex-start;
  gap:56px 48px;
  margin:0 0 56px;
  width:max-content;
  max-width:100%;
  padding:0;
  box-sizing:border-box;
}
.tile, figure.tile{
  position:relative;flex:none;flex-shrink:0;
  margin:0;
  max-width:100%;
  background:transparent;cursor:zoom-in;overflow:visible;
}
.tile img{
  width:100%;height:100%;object-fit:contain;object-position:center;
  display:block;vertical-align:bottom;
}

footer.site{
  padding:28px var(--pad) 40px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px 32px;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute);
}
footer.site a{color:var(--ink);text-decoration:none}
footer.site a:hover{color:var(--signal)}

#lb{
  position:fixed;inset:0;z-index:200;background:rgba(255,255,255,.97);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  padding:64px 72px 72px;
}
#lb.on{display:flex}
#lb img{
  width:auto;height:auto;
  max-width:min(560px, 72vw);
  max-height:min(64vh, 640px);
  object-fit:contain;
}
#lb .x, #lb .nav{
  position:absolute;background:none;border:0;color:var(--ink);cursor:pointer;
  font-family:var(--mono);min-width:var(--hit);min-height:var(--hit);
}
#lb .x{top:14px;right:18px;font-size:12px;letter-spacing:.14em}
#lb .nav.prev{left:12px;top:50%;transform:translateY(-50%);font-size:28px}
#lb .nav.next{right:12px;top:50%;transform:translateY(-50%);font-size:28px}
#lb .x:hover, #lb .nav:hover{color:var(--signal)}
#lb .meta{
  position:absolute;bottom:18px;left:24px;right:24px;
  display:flex;justify-content:space-between;gap:16px;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute);
}

@media(max-width:1100px){
  .projects{grid-template-columns:1fr 1fr;gap:24px}
  .project img{height:200px}
  #wall{padding:32px 6vw 72px}
  .row{gap:36px 32px;margin-bottom:40px}
}
@media(max-width:860px){
  :root{--pad:16px;--gap:6px;--hang:28px}
  #topbar{padding:8px 12px}
  #brand b{display:none}
  .projects{display:none}
  #wall{padding:24px 16px 64px}
  .row{gap:24px 16px;margin-bottom:28px}
  .row:nth-child(n){padding-left:0;padding-right:0;justify-content:flex-start}
  #lb{padding:56px 12px 64px}
  #lb .nav.prev{left:0} #lb .nav.next{right:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

function sizeFor(it, i, maxW){
  var ar = it.w / it.h;
  var band = window.innerWidth;
  var odd = (i % 2) === 1;
  var hero = !!LARGE[it.src];
  var sizes = band < 560 ? [132, 156, 118, 148] : band < 860 ? [160, 196, 140, 184] : [200, 248, 168, 228, 156, 236];
  var h = sizes[i % sizes.length];
  if(odd) h = Math.round(h * 1.62);
  if(hero) h = band < 860 ? 320 : 460;
  else {
    if(ar > 1.55) h = Math.min(h, odd ? (band < 860 ? 200 : 268) : (band < 860 ? 140 : 176));

  var imgCap = Math.min(maxW, (hero || odd) ? (band < 860 ? maxW : 520) : (band < 860 ? maxW : 340));
  if(w > imgCap){
    w = imgCap;
    h = w / ar;
  }
  return { w: w, h: h };
}

function renderWall(){
  var el = document.getElementById('wall');
  var items = WALL;
  var cs = getComputedStyle(el);
  var pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  var inner = Math.max(200, (el.clientWidth || document.documentElement.clientWidth || window.innerWidth) - pad);
  var g = window.innerWidth < 860 ? 16 : window.innerWidth < 1100 ? 32 : 48;
  var maxW = Math.floor(inner * 0.9);
  var cap = maxW;
  var html = '', row = [], rowW = 0, i, it, sz, k, n = 0, shift, eager;
  function tile(x){
    eager = x.i < 6;
    return '<figure class="tile" data-i="'+x.i+'" tabindex="0" role="button" style="width:'+x.sz.w.toFixed(2)+'px;height:'+x.sz.h.toFixed(2)+'px;margin:0">' +
      '<img '+(eager ? 'loading="eager"' : 'loading="lazy"')+' decoding="async" src="'+x.it.src+'" alt="'+t('alt')+'">' +
      '</figure>';
  }
  function flush(){
    if(!row.length) return;
    shift = Math.max(0, inner - rowW);
    if(n % 2 === 1) shift = shift;
    else if(n % 3 === 2) shift = shift * 0.5;
    else shift = 0;
    html += '<div class="row" style="margin-left:'+shift.toFixed(2)+'px">';
    for(k = 0; k < row.length; k++) html += tile(row[k]);
    html += '</div>';
    row = []; rowW = 0; n++;
  }
  for(i = 0; i < items.length; i++){
    it = items[i];
    sz = sizeFor(it, i, cap);
    if(row.length && rowW + g + sz.w > maxW) flush();
    row.push({it: it, sz: sz, i: i});
    rowW += sz.w + (row.length > 1 ? g : 0);
  }
  flush();
  el.innerHTML = html;
}

lb.addEventListener('touchstart', function(e){

lb.addEventListener('touchend', function(e){
  if(!e.changedTouches || !e.changedTouches[0]) return;
  var dx = e.changedTouches[0].clientX - sx;

  if(Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy)) return;

document.addEventListener('keydown', function(e){
  if(!lb.classList.contains('on')){
    if(e.key === 'ArrowRight'){ e.preventDefault(); }
    return;
  }
  if(e.key === 'Escape') closeLb();
  else if(e.key === 'ArrowRight'){ e.preventDefault(); curI++; showLb(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); curI--; showLb(); }
});
applyI18n();
})();
</script>
