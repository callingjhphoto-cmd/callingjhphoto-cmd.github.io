:root{
  --paper:#FFFFFF;
  --ink:#111111;
  --mute:#8A8A85;
  --line:#EDEDE8;
  --signal:#ff3b1f;

  --pad:28px;

}
*{box-sizing:border-box}
figure{margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{

#topbar{
  position:sticky;top:0;z-index:80;

  padding:14px var(--pad);
  background:rgba(255,255,255,.92);
}
#brand{
  display:flex;align-items:center;gap:10px;

}

#brand em{font-style:normal;color:var(--signal)}
#toplinks{
  display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:2px;
  font-size:13px;font-weight:500;
}
#toplinks a, #toplinks button{
  background:none;border:0;cursor:pointer;color:var(--mute);
  min-height:var(--hit);padding:8px 10px;display:inline-flex;align-items:center;
}
#toplinks a:hover, #toplinks button:hover, #toplinks a.on, #toplinks button.on{color:var(--ink)}
#toplinks .langpair{display:flex;gap:0;margin-left:4px}

#wall{
  width:100%;
  padding:8vh 5vw 12vh;
  display:flex;flex-direction:column;align-items:center;
}
.block{
  width:100%;
  display:flex;justify-content:center;align-items:flex-end;
  margin:0 0 8vh;
}
.block.pair{gap:22px;flex-wrap:nowrap}
.tile, figure.tile{
  position:relative;flex:none;flex-shrink:0;
  margin:0;padding:0;
  background:transparent;cursor:zoom-in;overflow:visible;
  line-height:0;
}
.tile img{
  width:100%;height:100%;object-fit:contain;object-position:center;
  display:block;
}

footer.site{
  padding:20px var(--pad) 36px;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 24px;
  font-size:13px;font-weight:500;color:var(--mute);
}
footer.site a{color:var(--ink)}
footer.site a:hover{color:var(--signal)}

#lb{
  position:fixed;inset:0;z-index:200;background:rgba(255,255,255,.97);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  padding:56px 48px 64px;
}
#lb.on{display:flex}
#lb img{
  width:auto;height:auto;
  max-width:min(92vw, 1100px);
  max-height:86vh;
  object-fit:contain;
}
#lb .x, #lb .nav{
  position:absolute;background:none;border:0;color:var(--ink);cursor:pointer;
  min-width:var(--hit);min-height:var(--hit);
}
#lb .x{top:12px;right:16px;font-size:13px;font-weight:500}
#lb .nav.prev{left:8px;top:50%;transform:translateY(-50%);font-size:28px}
#lb .nav.next{right:8px;top:50%;transform:translateY(-50%);font-size:28px}
#lb .x:hover, #lb .nav:hover{color:var(--signal)}
#lb .meta{
  position:absolute;bottom:16px;left:24px;right:24px;
  display:flex;justify-content:space-between;gap:16px;
  font-size:12px;font-weight:500;color:var(--mute);
}

@media(max-width:860px){

}

"w":1125,"h":1500},{"src":"img/own/home_21_1.jpg","w":1200,"h":1500},{"src":"img/own/home_23_0.jpg","w":1127,"h":1503},{"src":"img/own/home_23_1.jpg","w":1003,"h":1504}],"fencers":[{"src":"img/own/fencers_05_fencer-4.jpg","w":1482,"h":930},{"src":"img/own/fencers_01_fencer-11.jpg","w":1720,"h":654},{"src":"img/own/fencers_02_fencer-10.jpg","w":1404,"h":903}],"archery":[{"src":"img/own/archery_02_archery3-copy.jpg","w":1126,"h":720},{"src":"img/own/archery_03_archery4-copy.jpg","w":1486,"h":540},{"src":"img/own/archery_05_archery6-copy.jpg","w":1485,"h":540},{"src":"img/own/archery_06_archery7-copy.jpg","w":1119,"h":720}],"violins":[{"src":"img/own/violins_00_ian-violin-15.jpg","w":1200,"h":1500},{"src":"img/own/violins_02_ian-violin.jpg","w":1200,"h":1500},{"src":"img/own/violins_03_ian-violin-14.jpg","w":1200,"h":1500},{"src":"img/own/violins_04_ian-violin-1.jpg","w":1200,"h":1500},{"src":"img/own/violins_05_ian-violin-2-1.jpg","w":1125,"h":1500},{"src":"img/own/violins_06_ian-violin-21.jpg","w":1200,"h":1500},{"src":"img/own/violins_07_ian-violin-11.jpg","w":1125,"h":1500},{"src":"img/own/violins_08_ian-violin-16.jpg","w":1125,"h":1500},{"src":"img/own/violins_09_ian-violin-4.jpg","w":1125,"h":1500},{"src":"img/own/violins_10_ian-violin-3.jpg","w":1200,"h":1500}]};
function mixWall(works){
  var lead = works.selected[0];
  var body = works.selected.slice(1);
  var extras = [].concat(works.fencers, works.archery, works.violins);
  var i, j, tmp, seed = 9;
  function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  for(i = extras.length - 1; i > 0; i--){
    j = Math.floor(rnd() * (i + 1));
    tmp = extras[i]; extras[i] = extras[j]; extras[j] = tmp;
  }
  var wall = lead ? [lead] : [];
  var ei = 0;
  for(i = 0; i < body.length; i++){
    wall.push(body[i]);
    if(ei < extras.length && (i % 2) === 1) wall.push(extras[ei++]);
  }
  while(ei < extras.length) wall.push(extras[ei++]);
  return wall;
}
var WALL = mixWall(WORKS);
var I18N = {
  en: {
    'hero.h1':'Photography',

};

  if(stored === 'es' || stored === 'en') LANG = stored;

} catch(e){}

function t(k){
  return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
}
function applyI18n(){
  document.documentElement.lang = LANG === 'es' ? 'es' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(function(n){
    n.textContent = t(n.getAttribute('data-i18n'));
  });
  document.querySelectorAll('.langbtn').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === LANG);
  });
  document.querySelectorAll('.tile img').forEach(function(im){
    im.alt = t('alt');
  });
}
document.querySelectorAll('.langbtn').forEach(function(b){
  b.addEventListener('click', function(){
    LANG = b.getAttribute('data-lang') === 'es' ? 'es' : 'en';
    try { localStorage.setItem('jh-lang', LANG); } catch(e){}
    applyI18n();
  });
});

function isWide(it){ return (it.w / it.h) > 1.12; }
function fit(it, capW, capH){
  var ar = it.w / it.h;
  var h = Math.min(it.h, capH);
  var w = h * ar;
  if(w > capW){ w = capW; h = w / ar; }
  if(w > it.w){ w = it.w; h = it.h; }
  if(h > it.h){ h = it.h; w = it.w; }
  return { w: w, h: h };
}
function tile(it, i, sz, eager){
  return '<figure class="tile" data-i="'+i+'" tabindex="0" role="button" style="width:'+sz.w.toFixed(2)+'px;height:'+sz.h.toFixed(2)+'px">' +
    '<img '+(eager ? 'loading="eager"' : 'loading="lazy"')+' decoding="async" src="'+it.src+'" alt="'+t('alt')+'">' +
    '</figure>';
}
function renderWall(){
  var el = document.getElementById('wall');
  var items = WALL;
  var band = window.innerWidth;
  var inner = Math.max(260, el.clientWidth || band);
  var capH = Math.min(window.innerHeight * (band < 860 ? 0.70 : 0.78), 880);
  var capW = Math.min(inner * 0.92, band < 860 ? inner : 1040);
  var pairBox = Math.min(inner * 0.92, 1080);
  var gap = band < 860 ? 10 : 22;
  var html = '', i = 0, a, b, sa, sb, h, wide, eager;
  while(i < items.length){
    a = items[i];
    b = items[i + 1];
    eager = i < 4;
    if(b && i > 0 && !isWide(a) && !isWide(b) && (i % 4) !== 0){
      sa = fit(a, (pairBox - gap) / 2, capH);
      sb = fit(b, (pairBox - gap) / 2, capH);
      h = Math.min(sa.h, sb.h);
      sa = fit(a, (pairBox - gap) / 2, h);
      sb = fit(b, (pairBox - gap) / 2, h);
      html += '<div class="block pair">'+tile(a,i,sa,eager)+tile(b,i+1,sb,eager)+'</div>';
      i += 2;
    } else {
      wide = isWide(a);
      sa = fit(a, wide ? capW : Math.min(capW, capH * (a.w / a.h)), capH);
      html += '<div class="block single'+(wide ? ' land' : '')+'">'+tile(a,i,sa,eager)+'</div>';
      i += 1;
    }
  }
  el.innerHTML = html;
}

renderWall();

var resizeT;
window.addEventListener('resize', function(){
  clearTimeout(resizeT);

});

var lb = document.getElementById('lb');
var lbImg = document.getElementById('lbImg');
var lbCap = document.getElementById('lbCap');
var lbIdx = document.getElementById('lbIdx');
var curI = 0, sx = 0, sy = 0;
function showLb(){
  var list = WALL;
  curI = (curI + list.length) % list.length;
  var it = list[curI];
  var capW = Math.min(it.w, Math.floor(window.innerWidth * 0.92), 1100);
  var capH = Math.min(it.h, Math.floor(window.innerHeight * 0.86));
  lbImg.style.maxWidth = capW + 'px';
  lbImg.style.maxHeight = capH + 'px';
  lbImg.src = it.src;
  lbImg.alt = t('alt');
  lbCap.textContent = '';
  lbIdx.textContent = (curI + 1) + ' of ' + list.length;
}
function openLb(i){
  curI = i;
  showLb();
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLb(){
  lb.classList.remove('on');
  document.body.style.overflow = '';
}
document.getElementById('wall').addEventListener('click', function(e){
  var tile = e.target.closest ? e.target.closest('.tile') : null;
  if(!tile) return;
  openLb(parseInt(tile.getAttribute('data-i'), 10));
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    var tile = e.target.closest ? e.target.closest('.tile') : null;
    if(tile) openLb(parseInt(tile.getAttribute('data-i'), 10));
  }
});
document.getElementById('lbX').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', function(e){ e.stopPropagation(); curI--; showLb(); });
document.getElementById('lbNext').addEventListener('click', function(e){ e.stopPropagation(); curI++; showLb(); });
lb.addEventListener('click', function(e){ if(e.target === lb) closeLb(); });
lb.addEventListener('touchstart', function(e){
  if(!e.touches || !e.touches[0]) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
lb.addEventListener('touchend', function(e){
  if(!e.changedTouches || !e.changedTouches[0]) return;
  var dx = e.changedTouches[0].clientX - sx;
  var dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy)) return;
  if(dx < 0) curI++; else curI--;
  showLb();
}, {passive:true});
document.addEventListener('keydown', function(e){
  if(!lb.classList.contains('on')) return;
  if(e.key === 'Escape') closeLb();
  else if(e.key === 'ArrowRight'){ e.preventDefault(); curI++; showLb(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); curI--; showLb(); }
});
applyI18n();
})();
