<style>
:root{
  --paper:#FFFFFF;
  --ink:#111111;
  --mute:#8A8A85;
  --signal:#ff3b1f;
  --sans:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --hit:42px;
}
*{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body.is-booting{overflow:hidden}

#boot{
  position:fixed;inset:0;z-index:300;
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .75s ease;
}
#boot.out{opacity:0;pointer-events:none}
#boot .mark{
  font-family:"Syne",var(--sans);
  font-weight:800;
  font-size:clamp(40px, 8.5vw, 88px);
  letter-spacing:-.045em;
  line-height:.9;
  color:var(--ink);
}
::selection{background:var(--signal);color:#fff}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--signal);outline-offset:3px}

#topbar{
  position:fixed;top:0;left:0;right:0;z-index:80;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 24px;
  pointer-events:none;
}
#topbar a, #topbar button{pointer-events:auto}
#brand{
  font-size:15px;font-weight:600;letter-spacing:-.02em;
  min-height:var(--hit);display:flex;align-items:center;gap:10px;
}
#brand svg{width:20px;height:20px;display:block}
#toplinks{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:500}
#toplinks a, #toplinks button{
  color:var(--mute);min-height:var(--hit);padding:8px 10px;
  display:inline-flex;align-items:center;
}
#toplinks a:hover, #toplinks button:hover, #toplinks a.on, #toplinks button.on{color:var(--ink)}

#cue{
  position:fixed;left:0;right:0;bottom:28px;z-index:20;
  text-align:center;font-size:13px;font-weight:500;color:var(--mute);
  pointer-events:none;
  transition:opacity .6s ease;
}
#cue.hide{opacity:0}

.field{
  position:relative;
  width:95vw;
  margin:0 auto;
  min-height:100vh;
}
.parallaxdiv{
  position:absolute;
  top:0;left:0;
  cursor:cell;
  max-width:40vw;
  will-change:transform;
  line-height:0;
}
.linkedparaimg{
  display:block;
  max-width:40vw;
  max-height:50vh;
  width:auto;height:auto;
  object-fit:contain;
  cursor:pointer;
}
.pad{
  position:absolute;
  left:0;width:100%;
  height:1px;
  pointer-events:none;
}

#lb{
  position:fixed;inset:0;z-index:200;background:rgba(255,255,255,.97);
  display:none;align-items:center;justify-content:center;
  padding:56px 48px 64px;
}
#lb.on{display:flex}
#lb img{width:auto;height:auto;max-width:92vw;max-height:86vh;object-fit:contain}
#lb .x, #lb .nav{
  position:absolute;color:var(--ink);min-width:var(--hit);min-height:var(--hit);
}
#lb .x{top:12px;right:16px;font-size:13px;font-weight:500}
#lb .nav.prev{left:8px;top:50%;transform:translateY(-50%);font-size:28px}
#lb .nav.next{right:8px;top:50%;transform:translateY(-50%);font-size:28px}
#lb .x:hover, #lb .nav:hover{color:var(--signal)}
#lb .meta{
  position:absolute;bottom:16px;left:24px;right:24px;
  display:flex;justify-content:space-between;
  font-size:12px;font-weight:500;color:var(--mute);
}

@media(max-width:1024px){
  .parallaxdiv, .linkedparaimg{max-width:30vw}
}
@media(max-width:768px){
  #topbar{padding:10px 12px}
  .parallaxdiv, .linkedparaimg{max-width:42vw;max-height:36vh}
  #lb{padding:48px 10px 56px}
  #lb .nav.prev{left:0} #lb .nav.next{right:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

  window.addEventListener("wheel", function(){ stop(); resetIdle(); }, {passive:true});
  window.addEventListener("touchmove", function(){ stop(); resetIdle(); }, {passive:true});
  window.addEventListener("focus", resetIdle);
  window.addEventListener("blur", stop);
  resetIdle();
}

function initField(){
  divs = Array.prototype.slice.call(document.getElementsByClassName("parallaxdiv"));
  imgs = Array.prototype.slice.call(document.getElementsByClassName("linkedparaimg"));
  if(!divs.length) return;
  if(window.gsap){
    if(typeof ScrollTrigger !== "undefined") gsap.registerPlugin(ScrollTrigger);
    imgs.forEach(function(img){
      gsap.set(img, { opacity: 0 });
      var reveal = function(){ gsap.to(img, { opacity: 1, duration: 1.2, ease: "power2.out" }); };
      if(img.complete) reveal(); else img.addEventListener("load", reveal);
    });
  }
  layout();
  buildScrollParallax();
  buildMouseParallax();
  buildAutoscroll();
  runBoot();
  var resizeTimer;
  window.addEventListener("resize", function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if(device() !== currentDevice){ layout(); buildScrollParallax(); }
      else if(window.ScrollTrigger) ScrollTrigger.refresh();
    }, 200);
  });
}

var cue = document.getElementById("cue");
window.addEventListener("scroll", function(){
  if(window.scrollY > 40) cue.classList.add("hide");
  else cue.classList.remove("hide");
}, {passive:true});

var lb = document.getElementById("lb");
var lbImg = document.getElementById("lbImg");
var lbIdx = document.getElementById("lbIdx");
var curI = 0, sx = 0, sy = 0;
function showLb(){
  curI = (curI + WALL.length) % WALL.length;
  var it = WALL[curI];
  lbImg.style.maxWidth = Math.min(it.w, Math.floor(window.innerWidth * 0.92), 1100) + "px";
  lbImg.style.maxHeight = Math.min(it.h, Math.floor(window.innerHeight * 0.86)) + "px";
  lbImg.src = it.src;
  lbImg.alt = t("alt");
  lbIdx.textContent = (curI + 1) + " of " + WALL.length;
}
function openLb(i){ curI = i; showLb(); lb.classList.add("on"); document.body.style.overflow = "hidden"; }
function closeLb(){ lb.classList.remove("on"); document.body.style.overflow = ""; }
field.addEventListener("click", function(e){
  var im = e.target.closest ? e.target.closest(".linkedparaimg") : null;
  if(!im) return;
  openLb(parseInt(im.getAttribute("data-i"), 10));
});
document.getElementById("lbX").addEventListener("click", closeLb);
document.getElementById("lbPrev").addEventListener("click", function(e){ e.stopPropagation(); curI--; showLb(); });
document.getElementById("lbNext").addEventListener("click", function(e){ e.stopPropagation(); curI++; showLb(); });
lb.addEventListener("click", function(e){ if(e.target === lb) closeLb(); });
lb.addEventListener("touchstart", function(e){
  if(!e.touches || !e.touches[0]) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
lb.addEventListener("touchend", function(e){
  if(!e.changedTouches || !e.changedTouches[0]) return;
  var dx = e.changedTouches[0].clientX - sx;
  var dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy)) return;
  if(dx < 0) curI++; else curI--;
  showLb();
}, {passive:true});
document.addEventListener("keydown", function(e){
  if(!lb.classList.contains("on")) return;
  if(e.key === "Escape") closeLb();
  else if(e.key === "ArrowRight"){ e.preventDefault(); curI++; showLb(); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); curI--; showLb(); }
});

function runBoot(){
  var boot = document.getElementById("boot");
  var gone = false;
  function dismiss(){
    if(gone) return;
    gone = true;
    boot.classList.add("out");
    document.body.classList.remove("is-booting");
    setTimeout(function(){ if(boot.parentNode) boot.parentNode.removeChild(boot); }, 800);
  }
  if(reduceMotion){ dismiss(); return; }
  var need = Math.min(6, imgs.length);
  var ready = 0;
  var minOk = false;
  function maybe(){ if(minOk && ready >= need) dismiss(); }
  setTimeout(function(){ minOk = true; maybe(); }, 1100);
  imgs.slice(0, need).forEach(function(img){
    var done = function(){ ready++; maybe(); };
    if(img.complete && img.naturalWidth) done();
    else { img.addEventListener("load", done); img.addEventListener("error", done); }
  });
  if(!need){ minOk = true; dismiss(); }
  setTimeout(dismiss, 2600);
}

applyI18n();
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", initField);
else initField();
})();
</script>
</body>
</html>
